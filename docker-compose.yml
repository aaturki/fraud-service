services:
  fraud-api:
    build:
      context: .
    image: fraud-service:dev
    ports:
      - "8000:8000"
    env_file: configs/dev.env              # non-secret dev config, FRAUD_* keys only
    environment:
      FRAUD_REDIS_URL: redis://feature-cache:6379/0
    depends_on:
      feature-cache:
        condition: service_healthy         # gate on REAL readiness, not "started"
    healthcheck:                           # Python, not curl: the image ships no curl
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Least privilege at runtime: nothing in the container needs to write to its own
    # filesystem, gain privileges or use a Linux capability.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M                     # discover memory behaviour in dev, not prod

  feature-cache:
    # Pinned by digest, like the base image; Dependabot proposes updates.
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - cache-data:/data

volumes:
  cache-data:
