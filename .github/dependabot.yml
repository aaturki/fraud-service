# Pins only stay safe if someone moves them: Dependabot opens a pull request per update,
# and the same CI gates (including the image scan) decide whether it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker          # the digest-pinned python base image
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: docker-compose  # the digest-pinned redis image
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
